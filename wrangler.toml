name = "ssi-copilot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 21:00 UTC = 18:00 em Brasília: comentários todo dia, lembrete na véspera do post, resumo no domingo
# 11:30 UTC de terça = 8h30 em Brasília: post de imagem da semana
# A cada minuto: fila de trabalhos longos pedidos pelo Telegram (/post, /temas, /agora)
[triggers]
crons = ["0 21 * * *", "30 11 * * TUE", "* * * * *"]  # iguais a src/crons.ts

[[d1_databases]]
binding = "DB"
database_name = "ssi-copilot"
# Preenchido automaticamente pelo deploy (scripts/ensure-d1.mjs)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Navegador da Cloudflare (Browser Run) que desenha a arte do post
[browser]
binding = "BROWSER"

# Workers AI: ilustração do post (Flux 1 Schnell, dentro da cota grátis diária)
[ai]
binding = "AI"

[observability]
enabled = true
