name = "ssi-copilot"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 21:00 UTC = 18:00 em Brasília (todo dia)
[triggers]
crons = ["0 21 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ssi-copilot"
# Preenchido automaticamente pelo deploy (scripts/ensure-d1.mjs)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[observability]
enabled = true
